// =====================================================================
//  capture_session.cfg  -  CSOZ material/perf CLIENT capture cfg TEMPLATE
// =====================================================================
//  This is the CLIENT cfg. The dedicated SERVER is launched separately:
//    xash3d.exe -dedicated -log -port 27023 +map de_dust2 +exec <server.cfg>
//  The client connects to it and self-drives the whole capture, then quits.
//
//  Launch (from <rundir>\client):
//    xash3d.exe -log -console -dev 2 -windowed -width 1920 -height 1080 \
//               -nosound +exec capture_session.cfg
//
//  REQUIREMENTS for the [CSZ:fps] log lines to appear:
//    - launch flag  -log   (writes <rundir>\client\engine.log)
//    - developer 1  (set below) or launch flag -dev 2
//
//  `wait` is PER-FRAME, not per-second. At fps_max 200:
//      wait N  ~=  N / 200  seconds.
//    so  wait 500   ~= 2.5 s     (sky brightness auto-adapt settle)
//        wait 900   ~= 4.5 s     (let connect/spawn finish)
//        wait 15000 ~= 75 s      (FPS sampling window, > 60 s requirement)
//    Adjust the multipliers if fps_max changes.
// =====================================================================

// ---- 1. engine / logging setup -------------------------------------
developer 1                 // enable [CSZ:fps] + [CSZ:...] log spam
fps_max 200                 // cap; parser warns if avg exceeds cap+5
csz_showfps 1               // on-screen fps overlay (harmless headless)
// csz_sky_debug 1          // OPTIONAL: dump per-phase tint/fog to log
setinfo _vgui_menus 0       // skip the VGUI join menu so scripted join works

// ---- 2. connect to the dedicated server ----------------------------
connect 127.0.0.1:27023     // OPERATOR: match -port of the server launch
wait 900                    // ~4.5s: let connect + map download/load finish

// ---- 3. spawn into the world ---------------------------------------
jointeam 2                  // 2 = T (CT = 1); pick a team
joinclass 1                 // pick a player model/class
wait 200                    // ~1s: let spawn settle

// =====================================================================
//  4. === PER-SCENE BLOCK  (OPERATOR FILLS THIS PER CAPTURE) =========
//     Repeat / duplicate this block for each look you want to grab.
//     Order: freeze look -> let brightness adapt -> position -> shot.
// ---------------------------------------------------------------------
//   csz_sky_phase <VALUE>      // -1=live 0.0=sunset 0.5=midnight
//                              //  0.86=dawn 1.0=day  (deterministic look)
//   wait 500                   // ~2.5s: renderer brightness auto-adapt
//
//   // OPTIONAL: fly out of the cramped spawn corner for open-courtyard
//   //          WORLD pass stats (prior run used noclip):
//   // noclip
//   // setpos <x> <y> <z>       // OPERATOR: courtyard coords for the map
//   // setang <pitch> <yaw> <roll>
//
//   wait 60                    // >=20 frames after a state change before shot
//   screenshot                 // -> <rundir>\client\cstrike\scrshots\<map>_shotNNNN.png
//   wait 60                    // let the screenshot flush
// =====================================================================
//  Example concrete scene (uncomment + edit to use):
//   csz_sky_phase 1.0
//   wait 500
//   noclip
//   setpos 256 -512 96
//   wait 60
//   screenshot
//   wait 60
// =====================================================================

// ---- 5. FPS SAMPLING WINDOW ----------------------------------------
//   Parser slices engine.log between these two echo markers. Keep them
//   exact unless you also pass matching --start-marker/--end-marker.
//   Hold the camera/look you want measured BEFORE the START echo.
echo MATPERF-FPS-START
wait 15000                  // ~75 s of 1Hz [CSZ:fps] samples (>60s gate)
echo MATPERF-FPS-END

// ---- 6. done -------------------------------------------------------
quit                        // run_capture.ps1 polls for this exit
